# Este workflow conecta a MySQL desde un runner de GitHub con IP dinamica.
# Solo funcionara si la instancia de MySQL es alcanzable desde internet
# (o mediante un runner self-hosted / tunel SSH). No lo actives hasta tener
# decidido como se expondra la base de datos en produccion.
name: Daily Competitor Crawl

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python main.py

      - name: Notify failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Daily crawl failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
